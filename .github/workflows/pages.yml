name: Publicar HUB en GitHub Pages
# Solo se publica cuando el propietario pulsa Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node para generar HTML
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar páginas estáticas
        run: node scripts/build.mjs
      - name: Comprobar contenido, búsqueda y enlaces
        run: node tests/check.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir únicamente archivos públicos
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
